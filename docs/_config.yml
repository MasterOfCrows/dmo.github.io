# Site settings
title: Diallo's Ramblings
email: molinadiallo@gmail.com
description: >-
  Site for my ramblings and history, thoughts and philosophies.
lang: en-US
timezone: EST  
image: assets/img/ogp.png 
repo: https://github.com/MasterOfCrows/dmo 
mode: dark 

author:
  name: Diallo Molina
  bio: >-
    A place for my thoughts, projects, and philosophy.
  github: MasterOfCrows
  twitter: DialloTheGreat
  email: molinadiallo@gmail.com
  avatar: /assets/img/avatar.jpg # add this image if you want an avatar

# URL settings
url: "https://dmo.github.io"
baseurl: ""
domain: dmo.github.io
permalink: /:title/
google_analytics: # leave blank unless you have an ID

# Collection setting
collections:
  posts:
    output: truee

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: post
      comments: false

# Jekyll Compose default front matter
jekyll_compose:
  post_default_front_matter:
    modified:
    tags: []
    description:
  draft_default_front_matter:
    modified:
    tags: []
    description:

# Homepage limit posts
number_of_posts: 5

# Build settings
sass:
  style: compressed

include:
  - _redirects
  - .htaccess

# Exclude items that shouldn't be built into site
exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - CHANGELOG.md
  - README.md
  - node_modules
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - lighthouse.png
  - klise-*.gem
  - klise.gemspec

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-postfiles
