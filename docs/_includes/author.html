<div class="author">
  <div class="author-avatar-group">
    <img
      class="author-avatar"
      src="{{ site.author.avatar_real }}"
      alt="{{ site.author.username }} real"
    />
    <img
      class="author-avatar"
      src="{{ site.author.avatar_persona }}"
      alt="{{ site.author.username }} persona"
    />
  </div>
  <h2 class="author-name">{{ site.author.name }}</h2>
  <p class="author-bio">{{ site.author.bio }}</p>
</div>
